name: Domain layout cleanup

on:
  push:
    branches: [stage1-domain-layout-cleanup]

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1-domain-layout-cleanup
          fetch-depth: 0

      - name: Reorganize transition forecasting layout
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            scripts/transition_forecasting/quality \
            scripts/transition_forecasting/catalogue \
            scripts/transition_forecasting/modeling \
            src/transition_forecasting/quality \
            src/transition_forecasting/catalogue \
            src/transition_forecasting/modeling \
            tests/transition_forecasting/quality \
            tests/transition_forecasting/catalogue \
            tests/transition_forecasting/modeling

          move_if_present() {
            src="$1"
            dst="$2"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              git mv "$src" "$dst"
            fi
          }

          move_if_present scripts/data/audit_annual_ohlc_range_quality.py scripts/transition_forecasting/quality/audit_annual_ohlc_range_quality.py
          move_if_present scripts/data/audit_early_ohlc_quality.py scripts/transition_forecasting/quality/audit_early_ohlc_quality.py
          move_if_present scripts/data/audit_global_index_ohlc.py scripts/transition_forecasting/quality/audit_global_index_ohlc.py
          move_if_present scripts/data/audit_global_ohlc_range_quality.py scripts/transition_forecasting/quality/audit_global_ohlc_range_quality.py
          move_if_present scripts/data/fetch_global_index_ohlc.py scripts/transition_forecasting/quality/fetch_global_index_ohlc.py

          move_if_present scripts/data/build_transition_events.py scripts/transition_forecasting/catalogue/build_transition_events.py
          move_if_present scripts/data/build_global_transition_catalogue.py scripts/transition_forecasting/catalogue/build_global_transition_catalogue.py
          move_if_present scripts/data/validate_global_transition_catalogue.py scripts/transition_forecasting/catalogue/validate_global_transition_catalogue.py

          move_if_present scripts/data/assess_global_stage_d_feasibility.py scripts/transition_forecasting/modeling/assess_global_stage_d_feasibility.py
          move_if_present scripts/data/build_global_stage_d_dataset.py scripts/transition_forecasting/modeling/build_global_stage_d_dataset.py

          move_if_present src/data/early_ohlc_quality.py src/transition_forecasting/quality/early_ohlc_quality.py
          move_if_present src/data/ohlc_range_quality.py src/transition_forecasting/quality/ohlc_range_quality.py
          move_if_present src/data/global_index_ohlc_audit.py src/transition_forecasting/quality/global_index_ohlc_audit.py
          move_if_present src/data/global_range_quality.py src/transition_forecasting/quality/global_range_quality.py
          move_if_present src/data/global_index_download.py src/transition_forecasting/quality/global_index_download.py

          move_if_present src/data/transition_events.py src/transition_forecasting/catalogue/transition_events.py
          move_if_present src/data/global_transition_catalogue.py src/transition_forecasting/catalogue/global_transition_catalogue.py
          move_if_present src/data/global_transition_validation.py src/transition_forecasting/catalogue/global_transition_validation.py

          move_if_present src/data/global_stage_d_feasibility.py src/transition_forecasting/modeling/global_stage_d_feasibility.py
          move_if_present src/data/global_stage_d_dataset.py src/transition_forecasting/modeling/global_stage_d_dataset.py

          for path in tests/data/test_*.py; do
            [ -e "$path" ] || continue
            name="$(basename "$path")"
            case "$name" in
              *stage_d*) dst="tests/transition_forecasting/modeling/$name" ;;
              *transition_catalogue*|*transition_events*) dst="tests/transition_forecasting/catalogue/$name" ;;
              *ohlc*|*range_quality*|*index_download*) dst="tests/transition_forecasting/quality/$name" ;;
              *) continue ;;
            esac
            git mv "$path" "$dst"
          done

          touch src/transition_forecasting/__init__.py
          touch src/transition_forecasting/quality/__init__.py
          touch src/transition_forecasting/catalogue/__init__.py
          touch src/transition_forecasting/modeling/__init__.py

          python - <<'PY'
          from pathlib import Path

          modules = {
              'early_ohlc_quality': 'transition_forecasting.quality.early_ohlc_quality',
              'ohlc_range_quality': 'transition_forecasting.quality.ohlc_range_quality',
              'global_index_ohlc_audit': 'transition_forecasting.quality.global_index_ohlc_audit',
              'global_range_quality': 'transition_forecasting.quality.global_range_quality',
              'global_index_download': 'transition_forecasting.quality.global_index_download',
              'transition_events': 'transition_forecasting.catalogue.transition_events',
              'global_transition_catalogue': 'transition_forecasting.catalogue.global_transition_catalogue',
              'global_transition_validation': 'transition_forecasting.catalogue.global_transition_validation',
              'global_stage_d_feasibility': 'transition_forecasting.modeling.global_stage_d_feasibility',
              'global_stage_d_dataset': 'transition_forecasting.modeling.global_stage_d_dataset',
          }

          for root in [Path('scripts'), Path('src'), Path('tests')]:
              for path in root.rglob('*.py'):
                  text = path.read_text()
                  updated = text
                  for old, new in modules.items():
                      updated = updated.replace(f'from data.{old} import', f'from {new} import')
                      updated = updated.replace(f'import data.{old}', f'import {new}')
                  if updated != text:
                      path.write_text(updated)

          config = Path('config/transition_forecasting/global_expansion.yaml')
          if config.exists():
              text = config.read_text()
              text = text.replace('scripts/data/fetch_global_index_ohlc.py', 'scripts/transition_forecasting/quality/fetch_global_index_ohlc.py')
              text = text.replace('scripts/data/build_global_transition_catalogue.py', 'scripts/transition_forecasting/catalogue/build_global_transition_catalogue.py')
              config.write_text(text)
          PY

          move_if_present results/transition_forecasting/audit_global_index_ohlc results/transition_forecasting/quality/global_index_ohlc_audit
          move_if_present results/transition_forecasting/build_transition_events results/transition_forecasting/catalogue/transition_events
          if [ -d results/transition_forecasting/data_audit_001 ]; then
            mkdir -p results/transition_forecasting/quality/data_audit
            git mv results/transition_forecasting/data_audit_001 results/transition_forecasting/quality/data_audit/data_audit_001
          fi
          move_if_present results/transition_forecasting/build_global_transition_catalogue results/transition_forecasting/catalogue/global_transition_catalogue
          move_if_present results/transition_forecasting/validate_global_transition_catalogue results/transition_forecasting/catalogue/global_transition_validation
          move_if_present results/transition_forecasting/assess_global_stage_d_feasibility results/transition_forecasting/modeling/stage_d_feasibility
          move_if_present results/transition_forecasting/build_global_stage_d_dataset results/transition_forecasting/modeling/stage_d_dataset
          move_if_present results/transition_forecasting/audit_annual_ohlc_range_quality results/transition_forecasting/quality/annual_ohlc_range_quality
          move_if_present results/transition_forecasting/audit_early_ohlc_quality results/transition_forecasting/quality/early_ohlc_quality
          move_if_present results/transition_forecasting/audit_global_ohlc_range_quality results/transition_forecasting/quality/global_ohlc_range_quality

          rm -f .github/workflows/domain-layout-cleanup.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "align transition forecasting code and result layout"
          git push origin HEAD:stage1-domain-layout-cleanup
