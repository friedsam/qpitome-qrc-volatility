name: Stage 1 transition data tests

on:
  push:
    branches: [stage1-dev]
    paths:
      - "README.md"
      - "pyproject.toml"
      - "environment.yml"
      - "src/transition_forecasting/**"
      - "scripts/transition_forecasting/**"
      - "scripts/hardware/**"
      - "scripts/reproduction/**"
      - "scripts/runs/run_submission.py"
      - "scripts/runs/run_submission_benchmarks.py"
      - "config/case151/**"
      - "qbraid_skill/**"
      - "tests/qbraid_skill/**"
      - "tests/transition_forecasting/**"
      - "tests/runs/test_run_submission.py"
      - "tests/runs/test_run_submission_benchmarks.py"
      - ".github/workflows/stage1-transition-data-tests.yml"
  pull_request:
    branches: [stage1-dev]
    paths:
      - "README.md"
      - "pyproject.toml"
      - "environment.yml"
      - "src/transition_forecasting/**"
      - "scripts/transition_forecasting/**"
      - "scripts/hardware/**"
      - "scripts/reproduction/**"
      - "scripts/runs/run_submission.py"
      - "scripts/runs/run_submission_benchmarks.py"
      - "config/case151/**"
      - "qbraid_skill/**"
      - "tests/qbraid_skill/**"
      - "tests/transition_forecasting/**"
      - "tests/runs/test_run_submission.py"
      - "tests/runs/test_run_submission_benchmarks.py"
      - ".github/workflows/stage1-transition-data-tests.yml"
  workflow_dispatch:

jobs:
  qbraid-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and skill validator
        run: python -m pip install -q -e ".[test]" skills-ref==0.1.1
      - name: Compile skill helpers
        run: python -m compileall -q qbraid_skill
      - name: Validate Agent Skills specification
        run: agentskills validate qbraid_skill/qpitome-qrc-volatility
      - name: Run qBraid skill contract tests
        run: python -m pytest -q --tb=short tests/qbraid_skill/test_skill_contract.py

  stage1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and tests
        run: python -m pip install -q -e ".[test]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Run Stage-1, Case151, and Phase-3 benchmark contracts
        run: >-
          python -m pytest -q --tb=short
          tests/transition_forecasting/data/test_acquisition.py
          tests/transition_forecasting/data/test_mnist_acquisition.py
          tests/transition_forecasting/modeling/test_stage_d_candidate_pool.py
          tests/transition_forecasting/modeling/test_chronological_control_matching.py
          tests/transition_forecasting/modeling/test_chronological_rematched_dataset.py
          tests/transition_forecasting/modeling/test_chronological_splits.py
          tests/transition_forecasting/data/test_fold_datasets.py
          tests/transition_forecasting/qrc/test_palindrome_real_task_relevance_assay.py
          tests/transition_forecasting/qrc/test_case151_reproduction_contract.py
          tests/transition_forecasting/qrc/test_mnist_palindrome_benchmark.py
          tests/transition_forecasting/qrc/test_temporal_rydberg_noise.py
          tests/transition_forecasting/qrc/test_palindrome_rydberg_noise.py
          tests/transition_forecasting/qrc/test_palindrome_scaling_assay.py
          tests/transition_forecasting/qrc/test_palindrome_shot_assay.py
          tests/runs/test_run_submission.py
          tests/runs/test_run_submission_benchmarks.py
