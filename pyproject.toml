[project]
name = "qpitome-qrc-volatility"
version = "0.1.0"
description = "Quantum reservoir computing for financial volatility prediction"
requires-python = ">=3.10"
dependencies = [
    "kaggle>=2.0,<3",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
baselines = [
    "arch>=7,<9",
    "scipy>=1.11,<2",
    "torch>=2.2,<3",
    "reservoirpy>=0.3,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
